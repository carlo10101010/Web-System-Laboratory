<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/Frontend/style.css"> 
    <title>Workout Activity</title>
</head>
<body>
    <div class="container">
        <div class="workout">
            <header class="workout-header">
                <h2>Workout Activity</h2>
                <input type="text" class="search-bar" placeholder="Search for a workout..." aria-label="Search for a workout">
            </header>
        
            <ul class="list-unstyled" id="Workoutlist">
            </ul>          
        </div>

        <div class="add-workout">
            <h2>Add Workout</h2>
            <form id="add-workout-form" class="mt-3">
                <div class="mb-3">
                    <label for="exercise-name" class="form-label">Exercise Name:</label>
                    <input 
                        type="text" 
                        id="exercise-name" 
                        class="form-control" 
                        placeholder="Enter exercise name" 
                        aria-label="Exercise name"
                    >
                </div>
                <div class="mb-3">
                    <label for="weight" class="form-label">Weight (kg):</label>
                    <input 
                        type="number" 
                        id="weight" 
                        class="form-control" 
                        placeholder="Enter weight" 
                        aria-label="Weight"
                    >
                </div>
                <div class="mb-3">
                    <label for="reps" class="form-label">Reps:</label>
                    <input 
                        type="number" 
                        id="reps" 
                        class="form-control" 
                        placeholder="Enter number of reps" 
                        aria-label="Reps"
                    >
                </div>
                <button 
                    type="button" 
                    id="add-button" 
                    class="btn btn-primary w-100" 
                    aria-label="Add workout"
                >
                    Add Workout
                </button>
            </form>
        </div>

        <div class="modal fade" id="editWorkoutModal" tabindex="-1" aria-labelledby="editWorkoutModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editWorkoutModalLabel">Edit Workout</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="edit-workout-form">
                            <div class="mb-3">
                                <label for="edit-exercise-name" class="form-label">Exercise Name:</label>
                                <input 
                                    type="text" 
                                    id="edit-exercise-name" 
                                    class="form-control" 
                                    placeholder="Enter exercise name" 
                                    aria-label="Edit Exercise Name">
                            </div>
                            <div class="mb-3">
                                <label for="edit-weight" class="form-label">Weight (kg):</label>
                                <input 
                                    type="number" 
                                    id="edit-weight" 
                                    class="form-control" 
                                    placeholder="Enter weight" 
                                    aria-label="Edit Weight"
                                >
                            </div>
                            <div class="mb-3">
                                <label for="edit-reps" class="form-label">Reps:</label>
                                <input 
                                    type="number" 
                                    id="edit-reps" 
                                    class="form-control" 
                                    placeholder="Enter number of reps" 
                                    aria-label="Edit Reps"
                                >
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" id="save-edit-button">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>   
    <script src="/Frontend/carlo.js"></script>
</body>
</html>
